# Publishes the site to GitHub Pages. Each deploy stamps the commit into the
# ?v=dev tags on CSS and JS links, so browsers fetch a matching set of files
# after an update instead of mixing cached old ones with new ones.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp asset versions
        run: |
          v="${GITHUB_SHA::8}"
          sed -i "s/?v=dev/?v=$v/g" *.html *.js
          grep -c "?v=$v" *.html *.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
